{% extends "base.html" %}
{% block title %}Analytics · Dump Bot{% endblock %}
{% block heading %}Analytics{% endblock %}
{% block content %}
<div class="card">
    <h3>Summary (7 days)</h3>
    <div id="summary-block"><p class="loading">loading…</p></div>
</div>
<div class="grid two-col">
    <div class="card">
        <h3>Per symbol</h3>
        <div id="per-symbol"
             hx-get="/api/fragments/coins"
             hx-trigger="load, every 30s"
             hx-swap="innerHTML">
            <p class="loading">loading…</p>
        </div>
    </div>
    <div class="card">
        <h3>Per setup</h3>
        <div id="per-setup"
             hx-get="/api/fragments/patterns"
             hx-trigger="load, every 30s"
             hx-swap="innerHTML">
            <p class="loading">loading…</p>
        </div>
    </div>
</div>
<script>
async function loadAnalyticsSummary() {
    const block = document.getElementById('summary-block');
    try {
        const r = await fetch('/api/analytics/summary?days=7');
        if (!r.ok) {
            block.innerHTML = '<div class="error-banner">Summary unavailable (' + r.status + ').</div>';
            return;
        }
        const sum = await r.json();
        block.innerHTML =
            '<p><b>Total:</b> ' + sum.total + ' &nbsp;' +
            '<b>Winrate:</b> ' + sum.winrate_pct.toFixed(2) + '% &nbsp;' +
            '<b>Avg MFE:</b> ' + sum.avg_mfe.toFixed(2) + '% &nbsp;' +
            '<b>Avg MAE:</b> ' + sum.avg_mae.toFixed(2) + '% &nbsp;' +
            '<b>Avg confidence:</b> ' + sum.avg_confidence.toFixed(1) + '</p>';
    } catch (e) {
        block.innerHTML = '<div class="error-banner">Summary failed: ' + e + '</div>';
    }
}
document.addEventListener('DOMContentLoaded', loadAnalyticsSummary);
setInterval(loadAnalyticsSummary, 30000);
</script>
{% endblock %}
